# Every push to main that changes the package publishes a release. tools/release.sh raises the version numbers one patch (unless
# raised by hand), commits that bump to main ([skip ci], so it starts no workflow), and this workflow then checks, builds and
# publishes the release v<version> as "latest". A push that only touches documentation, tools or tests releases nothing.
# The first run (no v* tag yet) releases the current version as-is. Run it by hand (Actions > Release > Run workflow) to force a check.
name: Release
on:
  push:
    branches: [main]
    paths-ignore:   # a documentation-only push does not need a release
      - "docs/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - name: Cache Node 8 and the old Chromium builds
        uses: actions/cache@v4
        with:
          path: ~/.cache/cleanyourtv
          key: cytv-engines-${{ runner.os }}-node8.12.0-chromium555668-706915
      - name: Libraries the old Chromium builds need
        run: |
          sudo apt-get update -qq
          for p in libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 libpangocairo-1.0-0 libgtk-3-0t64 libxss1 libxtst6 fonts-liberation; do sudo apt-get install -y -qq $p >/dev/null 2>&1 || echo "not installed: $p"; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Development tools (type checks, lint, formatting)
        run: npm ci --no-audit --no-fund
      - name: Checks (before anything is changed)
        run: sh tools/check.sh --chromium
      - name: Version numbers, commit the bump to main
        id: rel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          sh tools/release.sh
      - name: Build and publish the release
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          sh tools/check.sh
          CYTV_REPO="$GITHUB_REPOSITORY" python3 ipk/build.py
          gh release create "$TAG" --latest --target "$(git rev-parse HEAD)" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/*.ipk dist/*.ipk.sha256 dist/*.tgz dist/*.tgz.sha256 dist/apps.json dist/*.manifest.json
          # mirror the just-released code into the dev pre-release (built with CYTV_TAG=dev); a token push starts no workflow, so dispatch it
          gh workflow run dev-build.yml --ref refs/heads/main
